[workspace]
resolver = "2"
members = [
    "crates/agent-manager",
    "crates/ubiq",
    "crates/ubiq-app",
    "crates/ubiq-archify",
    "crates/ubiq-db",
    "crates/ubiq-drone",
    "crates/ubiq-host",
    "crates/ubiq-md",
    "crates/ubiq-proto",
