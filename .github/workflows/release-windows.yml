name: release-windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v2

      - id: version
        shell: bash
        run: echo "v=$(_devops/scripts/bundle-version.sh)" >> "$GITHUB_OUTPUT"

      - shell: bash
        run: just bundle-win

      - run: Compress-Archive -Path target/ubiq-windows-x86_64 -DestinationPath Ubiq-windows-x86_64.zip -Force

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.v }}
          name: ${{ steps.version.outputs.v }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          generate_release_notes: true
          files: Ubiq-windows-x86_64.zip