name: release-windows

on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
      channel:
        type: string
        required: true

env:
  UBIQ_VERSION: ${{ inputs.version }}
  UBIQ_CHANNEL: ${{ inputs.channel }}
  UBIQ_UPDATE_PUBKEY: ${{ vars.UPDATE_PUBLIC_KEY }}

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: extractions/setup-just@v2
      - uses: astral-sh/setup-uv@v5

      - shell: bash
        run: just bundle-win

      - run: Compress-Archive -Path target/ubiq-windows-x86_64 -DestinationPath Ubiq-windows-x86_64.zip -Force

      # Per-user installer; Inno Setup 6 ships on the runner, installed from choco if it does not.
      - name: Build installer
        shell: bash
        env:
          MSYS_NO_PATHCONV: "1"
        run: |
          set -euo pipefail
          ISCC="$(command -v iscc || true)"
          if [ -z "$ISCC" ]; then
            for p in "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" "/c/Program Files/Inno Setup 6/ISCC.exe"; do
              [ -x "$p" ] && ISCC="$p" && break
            done
          fi
          if [ -z "$ISCC" ]; then
            choco install innosetup -y --no-progress
            ISCC="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          fi
          # Inno wants a numeric-friendly version; the full string is fine for AppVersion.
          "$ISCC" "/DMyAppVersion=$UBIQ_VERSION" "/O$(cygpath -w "$PWD")" _devops/windows/ubiq.iss
          test -f Ubiq-Setup-x86_64.exe

      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          if-no-files-found: error
          path: |
            Ubiq-windows-x86_64.zip
            Ubiq-Setup-x86_64.exe
