name: release-macos

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v5
      - uses: extractions/setup-just@v2

      - id: version
        run: echo "v=$(_devops/scripts/bundle-version.sh)" >> "$GITHUB_OUTPUT"

      - run: just bundle

      - run: ditto -c -k --keepParent target/Ubiq.app Ubiq-macos-arm64.zip

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.v }}
          name: ${{ steps.version.outputs.v }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          generate_release_notes: true
          files: Ubiq-macos-arm64.zip
