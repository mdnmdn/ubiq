name: release-macos

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v5
      - uses: extractions/setup-just@v2

      - id: version
        run: echo "v=$(_devops/scripts/bundle-version.sh)" >> "$GITHUB_OUTPUT"

      - run: just bundle

      # Sign, and notarize when Apple credentials are set. Three modes, picked by which secrets exist:
      #   Developer ID cert + APPLE_* → signed, notarized, stapled (opens without a prompt)
      #   any cert (self-signed)      → signed, not notarized ("unidentified developer", Open Anyway)
      #   no cert                     → ad-hoc signed bundle, so macOS never calls it "damaged"
      # Nothing may write into Ubiq.app after `codesign` — `help.bundle` is copied in by
      # `just bundle`, so it is sealed with the rest of Resources.
      - name: Sign and notarize
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          set -euo pipefail
          APP=target/Ubiq.app

          if [ -z "$MACOS_CERT_P12" ]; then
            echo "::warning::no signing certificate — ad-hoc signing Ubiq.app"
            codesign --force --deep --sign - "$APP"
            codesign --verify --deep --strict --verbose=2 "$APP"
            exit 0
          fi

          KEYCHAIN="$RUNNER_TEMP/sign.keychain-db"
          KEYCHAIN_PW="$(uuidgen)"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PW" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          trap 'security delete-keychain "$KEYCHAIN"' EXIT

          # Notarization needs the hardened runtime and Apple's secure timestamp; a self-signed
          # identity gets the runtime but no timestamp.
          NOTARIZE=false
          if [ -n "$APPLE_ID" ] && [ -n "$APPLE_TEAM_ID" ] && [ -n "$APPLE_APP_PASSWORD" ]; then
            NOTARIZE=true
          fi
          TS=--timestamp=none
          if $NOTARIZE; then TS=--timestamp; fi
          for target in "$APP/Contents/MacOS/ubiq" "$APP"; do
            codesign --force $TS --options runtime --keychain "$KEYCHAIN" \
              --sign "$MACOS_SIGN_IDENTITY" "$target"
          done
          codesign --verify --deep --strict --verbose=2 "$APP"

          if ! $NOTARIZE; then
            echo "::warning::APPLE_* secrets not set — Ubiq.app is signed but not notarized"
            exit 0
          fi
          AUTH=(--apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD")
          ditto -c -k --keepParent "$APP" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" "${AUTH[@]}" \
            --wait --timeout 30m --output-format json > "$RUNNER_TEMP/notary.json" || true
          cat "$RUNNER_TEMP/notary.json"
          ID="$(plutil -extract id raw "$RUNNER_TEMP/notary.json")"
          STATUS="$(plutil -extract status raw "$RUNNER_TEMP/notary.json")"
          if [ "$STATUS" != "Accepted" ]; then
            xcrun notarytool log "$ID" "${AUTH[@]}"
            exit 1
          fi
          xcrun stapler staple "$APP"
          xcrun stapler validate "$APP"
          spctl --assess --type execute --verbose=4 "$APP"

      # Zipped after stapling, so the ticket travels inside the archive.
      - run: ditto -c -k --keepParent target/Ubiq.app Ubiq-macos-arm64.zip

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.v }}
          name: ${{ steps.version.outputs.v }}
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          generate_release_notes: true
          files: Ubiq-macos-arm64.zip
