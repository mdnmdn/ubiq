  <!-- Ubiq's mark, traced from assets/logo-white.png. One file for both themes: GPUI paints an
       `svg()` as an alpha mask in one colour, so the fill below is never seen and `theme::mark()`
       decides the ring's colour. The ring spins, so its box is recentred on the ring's own centre
       (482.75, 519.65) rather than on the mark's: the viewBox origin carries that offset, and
       ui/mark.rs shifts the layer back to put the mark together again. -->
