[package]
name = "agent-manager"
version = "0.1.0"
edition = "2024"
description = "Unified configuration manager for AI agent harnesses (Claude Code, Codex, GitHub Copilot, opencode, ...)"
license-file = "../../LICENSE"
repository = "https://github.com/mdnmdn/agent-manager"

[lib]
name = "agent_manager"
path = "src/lib.rs"

[[bin]]
name = "agent-manager"
path = "src/main.rs"
required-features = ["frontend"]

[features]
# Default build (standalone tool) ships both front ends.
default = ["frontend"]
# The clap CLI + ratatui TUI. Disable (`default-features = false`) when
# embedding the library — e.g. the Ubiq multiplexer only needs the core
# spec/resolve/registry/harness/provision modules.
frontend = ["cli", "tui"]
# The clap CLI plus the runtime that launches a harness through a PTY.
cli = ["dep:clap", "dep:tracing-subscriber", "pty", "keyring-store"]
tui = ["dep:ratatui", "dep:crossterm"]
# The passthrough runner: spawn the real harness in a PTY, forward the tty,
# resize on SIGWINCH, and propagate its exit code. Pulled in by `cli`; kept
# separate so the core (spec/resolve/registry/harness/provision) still builds
# with `--no-default-features` for lib mode.
pty = ["dep:portable-pty", "dep:crossterm", "dep:signal-hook"]
# In-process MCP for lib mode: host an embedder-registered `McpService` on a
# loopback HTTP MCP endpoint and inject it into the harness as a normal
# remote MCP server. Off by default (not part of `frontend`/`cli`); pulled in
# explicitly by embedders (or `--all-features`, e.g. for the E2E test).
inproc-mcp = ["dep:tiny_http"]
# `engine = "keyring"` credentials backend: stores secrets in the OS system
# credential store (macOS Keychain / Windows Credential Manager / Linux
# Secret Service) via the `keyring` crate, as a sibling to the `os` engine
# (which uses the `security` CLI on macOS instead). Pulled in by `cli` (so
# the standalone tool has it); kept separate so the core still builds
# `--no-default-features` without ever pulling in `keyring`.
keyring-store = ["dep:keyring"]

[dependencies]
# CLI (optional — `cli` feature)
clap = { version = "4", features = ["derive", "cargo", "wrap_help"], optional = true }

# TUI (optional — `tui` feature) / runner (optional — `pty` feature)
# 0.30 rather than 0.29: ratatui 0.29.0 pins `unicode-width = "=0.2.0"`, which cannot coexist in
# one lockfile with the `^0.2.2` merman's renderer needs. The TUI is a stub, so the bump is a
# manifest change and nothing else.
ratatui = { version = "0.30", optional = true }
crossterm = { version = "0.28", optional = true }

# Runner PTY backend (optional — `pty` feature; already a workspace dep)
portable-pty = { version = "0.8", optional = true }
# SIGWINCH delivery for the runner (optional — `pty` feature). crossterm's
# resize events read from stdin, which conflicts with raw byte passthrough,
# so we use signal-hook to catch SIGWINCH directly instead.
signal-hook = { version = "0.3", optional = true }

# Errors
anyhow = "1"
thiserror = "2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "1"

# Filesystem / paths
directories = "5"
walkdir = "2"

# Logging. Core, not optional: the I/O bridges trace every harness frame and
# every event they map it to, and an embedder collecting `tracing` gets that
# for free. `tracing` with no subscriber compiles to a handful of atomic
# loads, so a `--no-default-features` build pays nothing for it.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }

# In-process MCP loopback HTTP server (optional — `inproc-mcp` feature).
# Sync, no tokio — matches the crate's other optional runtime deps.
tiny_http = { version = "0.12", optional = true }

# The deny-by-default sandbox every isolated run is composed against. Core, not
# optional: `src/isolate.rs` builds an isol8 `Spec` in-process, so a run that
# asks to be confined is confined in lib mode too. Engine-only
# (`default-features = false` drops isol8's own `cli`, `registry` and `wizard`
# features — clap, serde_yaml, the offline registry types — none of which an
# embedder composing a run needs).
isol8 = { git = "https://github.com/mdnmdn/isol8", rev = "46c72edac4dda6d146af57f90121bb54820150eb", default-features = false }

# OS system credential store for the `keyring` credentials engine (optional —
# `keyring-store` feature). Default features (`v1`) pull in the
# platform-native backend: Keychain Services on macOS, Credential Manager on
# Windows, Secret Service (zbus) on Linux.
keyring = { version = "4", optional = true }

[dev-dependencies]
tempfile = "3"
# Sync HTTP client used only by the `inproc-mcp` E2E tests.
ureq = { version = "2", default-features = false, features = ["json"] }
