[package]
name = "ubiq-app"
version = "0.1.0"
edition = "2024"
license-file = "../../LICENSE"
description = "Ubiq: the application — the one place the interface and the host are named together"
publish = false

# The only crate that names both halves, and it names the host once: to start it and hand the
# interface the other end of the bus.
[lib]
name = "ubiq_app"
path = "src/lib.rs"

[[bin]]
name = "ubiq"
path = "src/main.rs"

[features]
# On by default: an on-device model is part of the application, not an extra. It is a feature
# rather than a plain dependency so that `--no-default-features` builds a complete Ubiq without
# a Swift toolchain or a macOS 26 SDK — the host then answers with its stub backend, which
# reports assistance unavailable, and every call site already reads correctly against that.
default = ["assist-apple"]

# Forwarded to the host, which owns the backend; the interface never names one. `ubiq-host` does
# not default it, so switching it off here is enough to switch it off everywhere.
#
# **On everywhere and effective only on macOS**, which is deliberate and not an oversight. The
# flag reaches every platform, and on each one that is not macOS it resolves to nothing: the host
# declares `foundation-models` under `[target.'cfg(target_os = "macos")'.dependencies]`, and gates
# the backend module on `all(target_os = "macos", feature = "assist-apple")`. So a Linux or
# Windows build carries the name and not the crate, and never asks for a Swift toolchain.
# `just apple` is what holds that true, by resolving the tree for three triples.
#
# The alternative — dropping it from `default` and enabling it per-target, with
# `[target.'cfg(target_os = "macos")'.dependencies] ubiq-host = { features = [...] }` — would say
# the same thing one line earlier and cost the escape hatch. Cargo features are additive: a
# feature a target dependency turns on cannot be turned off again, so `--no-default-features`
# would stop building a Ubiq that runs on a Mac without the Swift toolchain and the macOS 26 SDK.
# That build is the one `just check` covers on its second line, and it is worth more than the
# tidier manifest.
assist-apple = ["ubiq-host/assist-apple"]

[dependencies]
ubiq = { path = "../ubiq" }
ubiq-host = { path = "../ubiq-host" }
ubiq-proto = { path = "../ubiq-proto" }

anyhow = "1.0"
tracing = "0.1"
flume = "0.12"
percent-encoding = "2"

gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = [
    "font-kit",
    "wayland",
    "x11",
    "runtime_shaders",
] }
gpui-component = { git = "https://github.com/longbridge/gpui-component", rev = "df1d07b212e21217b1168e1728293b3e0c48e5a3" }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component", rev = "df1d07b212e21217b1168e1728293b3e0c48e5a3" }

[dev-dependencies]
# `handoff`'s tests claim a lock in a throwaway root rather than the real config dir.
tempfile = "3"

[target.'cfg(windows)'.build-dependencies]
# Embeds res/AppIcon.ico into the Windows executable. macOS builds it never enables,
# so the reference platform carries no icon-compilation dependency.
embed-resource = "3"
