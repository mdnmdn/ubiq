[package]
name = "ubiq-app"
version = "0.1.0"
edition = "2024"
license-file = "../../LICENSE"
description = "Ubiq: the application — the one place the interface and the host are named together"
publish = false

# The only crate that names both halves, and it names the host once: to start it and hand the
# interface the other end of the bus.
[lib]
name = "ubiq_app"
path = "src/lib.rs"

[[bin]]
name = "ubiq"
path = "src/main.rs"

[features]
# On by default: an on-device model is part of the application, not an extra. It is a feature
# rather than a plain dependency so that `--no-default-features` builds a complete Ubiq without
# a Swift toolchain or a macOS 26 SDK — the host then answers with its stub backend, which
# reports assistance unavailable, and every call site already reads correctly against that.
default = ["assist-apple"]

# Forwarded to the host, which owns the backend; the interface never names one. `ubiq-host` does
# not default it, so switching it off here is enough to switch it off everywhere.
assist-apple = ["ubiq-host/assist-apple"]

[dependencies]
ubiq = { path = "../ubiq" }
ubiq-host = { path = "../ubiq-host" }
ubiq-proto = { path = "../ubiq-proto" }

anyhow = "1.0"
tracing = "0.1"
flume = "0.12"
percent-encoding = "2"

gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = [
    "font-kit",
    "wayland",
    "x11",
    "runtime_shaders",
] }
gpui-component = { git = "https://github.com/longbridge/gpui-component" }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component" }

[dev-dependencies]
# `handoff`'s tests claim a lock in a throwaway root rather than the real config dir.
tempfile = "3"

[target.'cfg(windows)'.build-dependencies]
# Embeds res/AppIcon.ico into the Windows executable. macOS builds it never enables,
# so the reference platform carries no icon-compilation dependency.
embed-resource = "3"
