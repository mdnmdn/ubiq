[package]
name = "ubiq-drone"
version = "0.1.0"
edition = "2024"
license-file = "../../LICENSE"
description = "Ubiq: one machine's terminal, files and facts, served over a single duplex byte stream"
publish = false

# A drone knows nothing about agents, harnesses, accounts or version control. It is the lean host
# and the protocol, and that is the whole of its tree — `just relay` is the check that says so.
[dependencies]
ubiq-proto = { path = "../ubiq-proto" }
# `default-features = false` is the point of this binary: no harness library, no version control,
# no index, no listener, nothing that talks to a desktop. What is left is a machine's terminal,
# its files and its facts, which is exactly what a drone serves.
ubiq-host = { path = "../ubiq-host", default-features = false }
tracing = "0.1"
# Naming the bus's own timeout error, so a detached drone can tell a tick it should look at its
# linger from a hub that has actually gone. Already in the graph through `ubiq-proto`.
flume = "0.12"
# Stamping a seeded project record's `created_at`, which is a `chrono` type in the protocol. Named
# here only to build that one value; already in the workspace graph through `ubiq-proto`.
chrono = "0.4"
# The state file beside a listening drone's socket (`state::DroneState`) is JSON, so `--list` and
# `--status` can print it straight through. Both already in the graph via `ubiq-proto`; named here
# because this crate now derives and reads its own type, not just forwards somebody else's.
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# `filter.patterns` as gitignore-style globs, the same crate `ubiq_host::search` already links for
# its own walk and its index shortcut. Already in the graph through `ubiq-host`; named here because
# this crate now builds an `Override` of its own rather than only reading one back.
ignore = "0.4"

[dev-dependencies]
tempfile = "3"
