<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{TITLE}} · {{PROJECT_NAME}}</title>
  <!-- Blocking and inline on purpose: this has to set data-theme before the stylesheet below is
       applied, or every full navigation flashes light before script.js's own DOMContentLoaded
       handler corrects it. Keep THEME_KEY in sync with script.js's initTheme(). -->
  <script>
    (function () {
      var THEME_KEY = 'markdown-web-theme';
      try {
        var saved = localStorage.getItem(THEME_KEY);
        var theme = saved === 'dark' || saved === 'light'
          ? saved
          : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
  <link rel="stylesheet" href="/_assets/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css">
</head>
<body>

  <!-- Top App Header -->
  <header class="app-header">
    <div class="header-left">
      <button id="sidebar-toggle-btn" class="sidebar-toggle-btn" aria-label="Toggle navigation menu">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>

      <a href="{{HOME_URL}}" class="brand-link">
        <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
          <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
        </svg>
        <span>{{PROJECT_NAME}}</span>
      </a>
    </div>

    <div class="header-right">
      <div class="header-search">
        <svg class="header-search-icon" viewBox="0 0 16 16" width="14" height="14" fill="currentColor">
          <path d="M11.5 7a4.499 4.499 0 1 1-8.998 0A4.499 4.499 0 0 1 11.5 7zm-.82 4.74a6 6 0 1 0-1.06 1.06l3.04 3.04a.75.75 0 1 0 1.06-1.06l-3.04-3.04z"></path>
        </svg>
        <input type="text" id="content-search" class="header-search-input" placeholder="Search file contents…" autocomplete="off">
        <div id="content-search-results" class="header-search-results" hidden></div>
      </div>
      <button id="theme-toggle-btn" class="theme-toggle-btn" aria-label="Toggle color theme" title="Toggle theme">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>
    </div>
  </header>

  <!-- Main Container -->
  <div class="app-container">
    <!-- Left Navigation Sidebar -->
    <aside id="app-sidebar" class="app-sidebar">
      <div class="sidebar-filter-wrapper">
        <svg class="sidebar-filter-icon" viewBox="0 0 16 16" width="14" height="14" fill="currentColor">
          <path d="M11.5 7a4.499 4.499 0 1 1-8.998 0A4.499 4.499 0 0 1 11.5 7zm-.82 4.74a6 6 0 1 0-1.06 1.06l3.04 3.04a.75.75 0 1 0 1.06-1.06l-3.04-3.04z"></path>
        </svg>
        <input type="text" id="sidebar-filter" class="sidebar-filter" placeholder="Filter documents..." autocomplete="off">
        <button type="button" id="sidebar-label-toggle" class="sidebar-label-toggle" aria-label="Toggle between titles and file names" aria-pressed="false" title="Show file names">
          <svg class="label-icon label-icon-title" viewBox="0 0 16 16" width="14" height="14" fill="currentColor">
            <path d="M2 3.75A.75.75 0 0 1 2.75 3h10.5a.75.75 0 0 1 0 1.5H2.75A.75.75 0 0 1 2 3.75zm0 4A.75.75 0 0 1 2.75 7h10.5a.75.75 0 0 1 0 1.5H2.75A.75.75 0 0 1 2 7.75zm0 4a.75.75 0 0 1 .75-.75h6.5a.75.75 0 0 1 0 1.5h-6.5a.75.75 0 0 1-.75-.75z"></path>
          </svg>
          <svg class="label-icon label-icon-filename" viewBox="0 0 16 16" width="14" height="14" fill="currentColor">
            <path d="M2 1.75C2 .784 2.784 0 3.75 0h6.586c.464 0 .909.184 1.237.513l2.914 2.914c.329.328.513.773.513 1.237v9.586A1.75 1.75 0 0 1 13.25 16H3.75A1.75 1.75 0 0 1 2 14.25V1.75zm1.75-.25a.25.25 0 0 0-.25.25v12.5c0 .138.112.25.25.25h9.5a.25.25 0 0 0 .25-.25V6h-2.75A1.25 1.25 0 0 1 9.5 4.75V1.5H3.75zM11 1.94V4.5h2.56L11 1.94z"></path>
          </svg>
        </button>
        <button type="button" id="sidebar-scope-toggle" class="sidebar-label-toggle sidebar-scope-toggle" aria-label="Toggle between all files and docs only" aria-pressed="false" title="Docs only">
          <svg class="label-icon scope-icon-all" viewBox="0 0 16 16" width="14" height="14" fill="currentColor">
            <path d="M1.75 1A1.75 1.75 0 0 0 0 2.75v10.5C0 14.216.784 15 1.75 15h12.5A1.75 1.75 0 0 0 16 13.25v-8.5A1.75 1.75 0 0 0 14.25 3H7.5a.25.25 0 0 1-.2-.1l-.9-1.2C6.07 1.26 5.55 1 5 1H1.75z"></path>
          </svg>
          <svg class="label-icon scope-icon-docs" viewBox="0 0 16 16" width="14" height="14" fill="currentColor">
            <path d="M0 1.75C0 .784.784 0 1.75 0h8.5C10.716 0 11 .284 11 .75v3.5a.75.75 0 0 1 0 1.5h-1.5a.25.25 0 0 0-.25.25v7.5c0 .138.112.25.25.25h7.5a.25.25 0 0 0 .25-.25v-1.5a.75.75 0 0 1 1.5 0v1.5A1.75 1.75 0 0 1 9.25 16h-7.5A1.75 1.75 0 0 1 0 14.25v-7.5z"></path><path d="M5 1.75C5 .784 5.784 0 6.75 0h7.5C15.216 0 16 .784 16 1.75v7.5A1.75 1.75 0 0 1 14.25 11h-7.5A1.75 1.75 0 0 1 5 9.25v-7.5zm1.75-.25a.25.25 0 0 0-.25.25v7.5c0 .138.112.25.25.25h7.5a.25.25 0 0 0 .25-.25v-7.5a.25.25 0 0 0-.25-.25h-7.5z"></path>
          </svg>
        </button>
      </div>

      <div class="sidebar-tree-container">
        {{NAV_TREE}}
      </div>
    </aside>

    <!-- Main Content -->
    <main class="app-main">
      <article class="content-wrapper">
        <div class="markdown-body">
          {{CONTENT}}
        </div>
      </article>
    </main>

    <!-- Right Outline Table of Contents -->
    {{TOC}}
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="/_assets/script.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (window.hljs) hljs.highlightAll();
    });
  </script>
</body>
</html>
