[package]
name = "ubiq"
version = "0.1.0"
edition = "2024"
license-file = "../../LICENSE"
description = "Ubiq: GPUI-based agent harness multiplexer"
publish = false

[dependencies]
# The contract, the bus and the log sink. The interface names this and never the host.
ubiq-proto = { path = "../ubiq-proto" }

# GPUI core
gpui = { git = "https://github.com/zed-industries/zed", features = ["screen-capture"] }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = [
    "font-kit",
    "wayland",
    "x11",
    "runtime_shaders",
    "screen-capture",
] }
gpui-component = { git = "https://github.com/longbridge/gpui-component", features = [
    "tree-sitter-markdown",
    "tree-sitter-rust",
    "tree-sitter-python",
    "tree-sitter-javascript",
    "tree-sitter-java",
    "tree-sitter-toml",
    "tree-sitter-tsx",
    "tree-sitter-typescript",
    "tree-sitter-yaml",
    "tree-sitter-go",
    "tree-sitter-csharp",
    "tree-sitter-bash",
    "tree-sitter-c",
    "tree-sitter-swift",
    "tree-sitter-css",
    "tree-sitter-html",
    "tree-sitter-sql",
    "tree-sitter-kotlin",
    "tree-sitter-diff",
] }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component" }

# Terminal emulator component
gpui-terminal = { path = "../../vendor/gpui-terminal" }

# Serialization
serde = { version = "1.0", features = ["derive"] }
# The view-state blob the host stores opaquely is JSON, and its schema is the interface's
serde_json = "1.0"

# Logging
tracing = "0.1"
# Wall-clock timestamps for the log console, in the reader's own zone
chrono = "0.4"

# Mermaid, drawn here. A pure-Rust renderer with no browser and no system library behind it, which
# is what lets a diagram be drawn on a background thread of the interface's own. **Pinned with `=`**:
# it is an alpha, its API moved between 0.7 and 0.8, and the pin is half of the diagram cache's
# version marker — the two move together or the cache serves yesterday's picture forever.
merman = { version = "=0.8.0-alpha.5", default-features = false, features = [
    "layout-cytoscape",
    "svg",
] }
# The content address a cached diagram is filed under. A stable hash, because the name has to mean
# the same thing after a restart and after a toolchain upgrade.
sha2 = "0.10"

# Swift and C# ship a grammar in gpui-component but no highlight query — these three build the two
# `LanguageConfig`s that fill that gap, from the grammar crates' own bundled `highlights.scm`.
tree-sitter = "0.26"
tree-sitter-swift = "0.7"
tree-sitter-c-sharp = "0.23"

# The outline panel parses the buffer a second time, because gpui-component's parse tree is not
# reachable from outside it. Each grammar carries its own `TAGS_QUERY`, which is what names the
# definitions. Versions are the ones gpui-component already resolves to — a skew would put two
# `tree-sitter` crates in the tree and fail at runtime with `LanguageError`, not at compile time.
tree-sitter-rust = "0.24"
tree-sitter-python = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-go = "0.23"
tree-sitter-java = "0.23"
tree-sitter-c = "0.24"
tree-sitter-md = "0.5"

# Utilities
flume = "0.12"
parking_lot = "0.12"
# Small error type for the capture path, which spells one failure rather than an enum.
anyhow = "1"
# Remote-host dialer: TLS for `https://` saved hosts. Same rustls the host already
# uses, so there is one TLS stack in the workspace. `ring` pinned as the provider
# for the same reason it is on the host's side.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
# Trust roots for https dials: the platform's store first, the bundled Mozilla set
# when it cannot be read. Neither draws.
rustls-native-certs = "0.8"
webpki-roots = "0.26"
# Remote-host bearer tokens, one entry per saved host. The settings file carries the
# address and never the secret; this is where the secret lives.
keyring = "3"

# Local read-only doc/source viewer server (web_export module)
tiny_http = "0.12"
pulldown-cmark = "0.13"
ignore = "0.4"

# PNG encode for the capture flatten, and base-image dimensions for the capture
# scene. Decode for display stays GPUI's — this only measures and flattens.
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = [
    "NSApplication",
    "NSImage",
    "NSResponder",
] }
objc2-foundation = { version = "0.3", features = ["NSData"] }
# The frame type behind gpui's `ScreenCaptureFrame` on macOS is a `CVImageBuffer`, and this
# is what reads its pixels. Already in the graph behind gpui — named here because
# `app/capture.rs` decodes a frame itself.
core-video = "0.5"

# The frame type behind gpui's `ScreenCaptureFrame` on Windows and Linux, so a captured
# frame can be decoded. Same revision gpui resolves to — a skew would be two `scap` crates
# and a match that never fires. macOS decodes `CVImageBuffer` through `core-video` above.
[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
zed-scap = { git = "https://github.com/zed-industries/scap", rev = "4afea48c3b002197176fb19cd0f9b180dd36eaac", package = "zed-scap", version = "0.0.8-zed", default-features = false }

# Pin windows-capture to the 1.4 line on Windows: zed-scap@4afea48 needs the 1.4 API
# (`Context`, `as_nopadding_buffer`) but predates the 1.5 `Settings::new` breakage
# (new SecondaryWindow, MinimumUpdateInterval, DirtyRegion args). Upstream reverted the
# 1.5 bump and stayed on the 1.3/1.4 line, so stay there too.
# Named here only to constrain the resolver — no code uses it directly.
[target.'cfg(target_os = "windows")'.dependencies]
windows-capture = "=1.4.4"

[build-dependencies]
flate2 = "1"

[dev-dependencies]
# A blocking HTTP client, to exercise the web-export server's routing and path safety end to end.
ureq = "2"
# The console's state is asserted against the sink's own types
ubiq-proto = { path = "../ubiq-proto" }
# A window with no graphics device behind it. Same revision as the dependency above — this only
# turns on the test platform, and never becomes a dependency of the binary.
gpui = { git = "https://github.com/zed-industries/zed", features = ["test-support"] }
# A throwaway workarea for the diagram cache's disk tier
tempfile = "3"
