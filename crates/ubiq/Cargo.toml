[package]
name = "ubiq"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Ubiq: GPUI-based agent harness multiplexer"
publish = false

[dependencies]
# GPUI core
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = [
    "font-kit",
    "wayland",
    "x11",
    "runtime_shaders",
] }
gpui-component = { git = "https://github.com/longbridge/gpui-component", features = [
    "tree-sitter-markdown",
    "tree-sitter-rust",
    "tree-sitter-python",
    "tree-sitter-javascript",
    "tree-sitter-toml",
    "tree-sitter-tsx",
    "tree-sitter-typescript",
] }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component" }

# Terminal emulator component
gpui-terminal = { path = "../../vendor/gpui-terminal" }

# PTY and terminal management
portable-pty = "0.9"

# Async runtime
tokio = { version = "1.40", features = ["full"] }
futures = "0.3"

# UUID for pane IDs
uuid = { version = "1.10", features = ["v4", "serde"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Wall-clock timestamps for the log console, in the reader's own zone
chrono = "0.4"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Utilities
flume = "0.12"
parking_lot = "0.12"
once_cell = "1.20"
