[package]
name = "ubiq"
version = "0.1.0"
edition = "2024"
license-file = "../../LICENSE"
description = "Ubiq: GPUI-based agent agentic workspace"
publish = false

[features]
# Not a default here: `ubiq-app` turns it on, so switching it off there is enough to switch it off
# everywhere. See the dependency's own note below for what it costs and what a build without it does.
quickjs = ["dep:rquickjs"]

[dependencies]
# The contract, the bus and the log sink. The interface names this and never the host.
ubiq-proto = { path = "../ubiq-proto" }

# QuickJS, the interpreter behind the sink's script page (`state/script.rs`). A small C engine
# compiled into the process — no runtime, no window, no subprocess, and no network — which is what
# lets a script be run synchronously on a background thread of the interface's own. Optional
# because it is the one C compile in this crate's tree: off it, the facade answers "unavailable"
# and the page says so, which is a complete Ubiq minus one page's contents. Default features only
# (`std`): the plain `Runtime`/`Context`/`Function`/`Value` surface, with no module loader and no
# `bindgen` — the page evaluates one string and imports nothing.
rquickjs = { version = "0.13", optional = true }

# The front end in front of that interpreter (`state/script.rs`): oxc parses both dialects and
# transpiles TypeScript to the JavaScript QuickJS actually runs. A real parser, not a grammar —
# it reports the errors a compiler reports, at the span it found them, and its transformer erases
# the whole TypeScript surface rather than the subset a syntax tree can be edited down to. Not
# behind the `quickjs` feature: validation is a parse, and the page syntax-checks in a build with
# no interpreter in it. `default-features = false` drops the regular-expression parser, which only
# matters to a linter walking the inside of a literal.
oxc = { version = "0.150", default-features = false, features = [
    "codegen",
    "semantic",
    "transformer",
] }

# GPUI core
gpui = { git = "https://github.com/zed-industries/zed", features = ["screen-capture"] }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = [
    "font-kit",
    "wayland",
    "x11",
    "runtime_shaders",
    "screen-capture",
] }
gpui-component = { git = "https://github.com/longbridge/gpui-component", rev = "df1d07b212e21217b1168e1728293b3e0c48e5a3", features = [
    "tree-sitter-markdown",
    "tree-sitter-rust",
    "tree-sitter-python",
    "tree-sitter-javascript",
    "tree-sitter-java",
    "tree-sitter-toml",
    "tree-sitter-tsx",
    "tree-sitter-typescript",
    "tree-sitter-yaml",
    "tree-sitter-go",
    "tree-sitter-csharp",
    "tree-sitter-bash",
    "tree-sitter-c",
    "tree-sitter-swift",
    "tree-sitter-css",
    "tree-sitter-html",
    "tree-sitter-sql",
    "tree-sitter-kotlin",
    "tree-sitter-diff",
] }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component", rev = "df1d07b212e21217b1168e1728293b3e0c48e5a3" }

# The LSP vocabulary gpui-component's provider traits are written in — a `CompletionProvider`
# answers with `lsp_types::CompletionResponse`, so the `/` menu in `ui/editor.rs` has to name the
# same crate the component does. Pinned to gpui-component's own version and features; Cargo
# unifies the two, so this is one crate and not a second copy.
lsp-types = { version = "0.97.0", features = ["proposed"] }

# The same Markdown parser gpui-component's text view runs, named directly so the fence scan in
# `ui/viewer/markdown.rs` produces the *same* fence body the view's block parser is handed — a
# hand-rolled second scanner drifted from it by a trailing newline and the diagram cache never hit.
# Cargo unifies this with gpui-component's own copy, so it is one parser, not two.
markdown = "1.0"

# Terminal emulator component
gpui-terminal = { path = "../../vendor/gpui-terminal" }

# Serialization
serde = { version = "1.0", features = ["derive"] }
# The view-state blob the host stores opaquely is JSON, and its schema is the interface's
serde_json = "1.0"

# Inflates one entry at a time out of a vendor bundle archive (`web_export/archive.rs`). Already
# a build-dependency below for the same reason on the writing side; needed here too to read back.
flate2 = "1"

# A2UI's `regex` validation function compiles a pattern an agent wrote (`state/a2ui/eval.rs`).
# Free to add: `ubiq-proto` already depends on it, so it is in this workspace's tree either way.
regex = "1"

# Logging
tracing = "0.1"
# Wall-clock timestamps for the log console, in the reader's own zone
chrono = "0.4"

# Mermaid, drawn here. A pure-Rust renderer with no browser and no system library behind it, which
# is what lets a diagram be drawn on a background thread of the interface's own. **Pinned with `=`**:
# it is an alpha, its API moved between 0.7 and 0.8, and the pin is half of the diagram cache's
# version marker — the two move together or the cache serves yesterday's picture forever.
merman = { version = "=0.8.0-alpha.5", default-features = false, features = [
    "layout-cytoscape",
    "svg",
] }
# The content address a cached diagram is filed under. A stable hash, because the name has to mean
# the same thing after a restart and after a toolchain upgrade.
sha2 = "0.10"

# Swift and C# ship a grammar in gpui-component but no highlight query — these three build the two
# `LanguageConfig`s that fill that gap, from the grammar crates' own bundled `highlights.scm`.
tree-sitter = "0.26"
tree-sitter-swift = "0.7"
tree-sitter-c-sharp = "0.23"

# The outline panel parses the buffer a second time, because gpui-component's parse tree is not
# reachable from outside it. Each grammar carries its own `TAGS_QUERY`, which is what names the
# definitions. Versions are the ones gpui-component already resolves to — a skew would put two
# `tree-sitter` crates in the tree and fail at runtime with `LanguageError`, not at compile time.
tree-sitter-rust = "0.24"
tree-sitter-python = "0.23"
tree-sitter-javascript = "0.23"
tree-sitter-typescript = "0.23"
tree-sitter-go = "0.23"
tree-sitter-java = "0.23"
tree-sitter-c = "0.24"
tree-sitter-md = "0.5"

# Utilities
flume = "0.12"
parking_lot = "0.12"
# Small error type for the capture path, which spells one failure rather than an enum.
anyhow = "1"
# Remote-host dialer: TLS for `https://` saved hosts. Same rustls the host already
# uses, so there is one TLS stack in the workspace. `ring` pinned as the provider
# for the same reason it is on the host's side.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
# Trust roots for https dials: the platform's store first, the bundled Mozilla set
# when it cannot be read. Neither draws.
rustls-native-certs = "0.8"
webpki-roots = "0.26"
# Remote-host bearer tokens, one entry per saved host. The settings file carries the
# address and never the secret; this is where the secret lives.
keyring = "3"

# Local read-only doc/source viewer server (web_export module)
tiny_http = "0.12"
pulldown-cmark = "0.13"
ignore = "0.4"

# PNG encode for the capture flatten, and base-image dimensions for the capture
# scene. Decode for display stays GPUI's — this only measures and flattens.
# `tiff` and `bmp` are decoders, and they are here for one reason: a pasted picture is written
# into the project to be *opened by a harness*, and harness image support is png/jpeg/gif/webp.
# A macOS screenshot arrives on the pasteboard as TIFF and a Windows DIB as BMP, so without these
# two the one gesture that has no path behind it produces a path nothing can read —
# `app/clipboard.rs::pasted_image_bytes`.
image = { version = "0.25", default-features = false, features = [
    "png",
    "tiff",
    "bmp",
] }

# The embedded browser a web panel draws in. `gpui-wry` is gpui-component's own wry binding —
# same repository, so it resolves to the revision the component crates already pin, and a child
# webview is laid out by a GPUI element rather than by a second window. macOS and Windows only:
# the crate's Unix path is unfinished upstream, so every other platform keeps the external
# browser that phase 5 shipped.
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
gpui-wry = { git = "https://github.com/longbridge/gpui-component", rev = "df1d07b212e21217b1168e1728293b3e0c48e5a3" }
wry = { version = "0.53.3", package = "lb-wry" }
raw-window-handle = { version = "0.6", features = ["std"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = [
    "NSApplication",
    "NSImage",
    "NSResponder",
] }
objc2-foundation = { version = "0.3", features = ["NSData"] }
# The frame type behind gpui's `ScreenCaptureFrame` on macOS is a `CVImageBuffer`, and this
# is what reads its pixels. Already in the graph behind gpui — named here because
# `app/capture.rs` decodes a frame itself.
core-video = "0.5"

# The frame type behind gpui's `ScreenCaptureFrame` on Windows and Linux, so a captured
# frame can be decoded. Same revision gpui resolves to — a skew would be two `scap` crates
# and a match that never fires. macOS decodes `CVImageBuffer` through `core-video` above.
[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
zed-scap = { git = "https://github.com/zed-industries/scap", rev = "4afea48c3b002197176fb19cd0f9b180dd36eaac", package = "zed-scap", version = "0.0.8-zed", default-features = false }

# Pin windows-capture to the 1.4 line on Windows: zed-scap@4afea48 needs the 1.4 API
# (`Context`, `as_nopadding_buffer`) but predates the 1.5 `Settings::new` breakage
# (new SecondaryWindow, MinimumUpdateInterval, DirtyRegion args). Upstream reverted the
# 1.5 bump and stayed on the 1.3/1.4 line, so stay there too.
# Named here only to constrain the resolver — no code uses it directly.
[target.'cfg(target_os = "windows")'.dependencies]
windows-capture = "=1.4.4"

# An integration test that drives the interpreter is a target of the feature that compiles it in,
# not of the crate: without this, `cargo test` on a build with `quickjs` off would try to run a
# script through a facade that has nothing to run it with.
[[test]]
name = "script"
required-features = ["quickjs"]

[build-dependencies]
flate2 = "1"

[dev-dependencies]
# A blocking HTTP client, to exercise the web-export server's routing and path safety end to end.
ureq = "2"
# The console's state is asserted against the sink's own types
ubiq-proto = { path = "../ubiq-proto" }
# A window with no graphics device behind it. Same revision as the dependency above — this only
# turns on the test platform, and never becomes a dependency of the binary.
gpui = { git = "https://github.com/zed-industries/zed", features = ["test-support"] }
# A throwaway workarea for the diagram cache's disk tier
tempfile = "3"
