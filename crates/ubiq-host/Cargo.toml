[package]
name = "ubiq-host"
version = "0.1.0"
edition = "2024"
license-file = "../../LICENSE"
description = "Ubiq: the headless host — processes, pseudo-terminals, and the project catalogue"
publish = false

# The host draws nothing. No GPUI crate may appear in this tree, directly or transitively, and
# `just host` is the check that says so.
[dependencies]
ubiq-proto = { path = "../ubiq-proto" }
# The harness library, embedded. It owns every fact about how an agent is configured and launched;
# this crate owns the pseudo-terminal it lands in. `default-features = false` drops its own CLI and
# TUI front ends — an application with a window needs neither — and leaves the core that composes a
# run. See `_docs/tech/agent-manager.md` for the rules across this edge.
agent-manager = { path = "../agent-manager", default-features = false }
portable-pty = "0.9"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
toml = "1"
directories = "5"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
tracing = "0.1"
flume = "0.12"
# Version control. Reading it — blobs from HEAD and from the index — is what nearly every use here
# is, and needs no transport at all. `https` is compiled in for exactly one thing: cloning a
# repository into existence, which is the only moment Ubiq's git talks to a network. Everything
# after the clone is still read-only, and ssh stays out — a clone goes over https or not at all.
git2 = { version = "0.21", default-features = false, features = ["https"] }
# The hunks themselves. A diff library lives here and never in the interface.
similar = "2"
# Content search: walk the tree with the project's own ignore rules, match with the ripgrep
# libraries. None of these draw; `just host` stays green.
ignore = "0.4"
grep-matcher = "0.1"
grep-regex = "0.1"
grep-searcher = "0.1"
num_cpus = "1"
# Filesystem watch: one recursive handle per open project. Already in the workspace build graph
# through `gpui-component`, so a direct edge here is a manifest line, not a new crate to vet.
notify = "7"
# Deleting to the platform's trash, so a removal the user regrets is recoverable outside Ubiq. It
# talks to the desktop's own trash service and draws nothing, so `just host` stays green.
trash = "5"

# The connector family's HTTP: a blocking client, because every request it makes is already on a
# flow's own thread and an async runtime would be a second scheduler for nobody. `default-features
# = false` drops its gzip and cookie machinery; `tls` is the rustls backend the pin verifier below
# plugs into. Draws nothing.
ureq = { version = "2.12", default-features = false, features = ["tls", "json"] }
# TLS itself, named rather than inherited: the pin verifier is a `ServerCertVerifier`, and the
# crypto provider is pinned to `ring` here so a crate elsewhere enabling `aws-lc-rs` cannot turn a
# missing process default into a runtime panic. No window, no drawing.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
# The machine's own trust store, so a company's internal CA works without anyone being asked to
# vouch for a certificate. Reads the platform's roots and nothing else.
rustls-native-certs = "0.8"
# The floor under the platform roots, for a machine whose trust store cannot be read. A static
# table of public CAs — no code runs, nothing draws.
webpki-roots = "0.26"
# Reading a leaf certificate so the user can be shown what they are vouching for: subject, SANs,
# issuer, validity. A parser, no I/O, no UI.
x509-parser = "0.18"
# The fingerprint a pin is: SHA-256 over a certificate's DER. One hash, no drawing.
sha2 = "0.10"
# The PKCE verifier and the `state` nonce. A CSPRNG and nothing else.
rand = "0.8"
# The loopback listener an OAuth redirect lands on: one bound port, one request, then dropped. A
# blocking HTTP server small enough to have no runtime and no view layer.
tiny_http = "0.12"

[dev-dependencies]
tempfile = "3"
# The pin verifier's own test drives it through `ServerCertVerifier`, which means naming rustls'
# types. The same version the dependency above resolves to, so there is one rustls in the build.
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
