[package]
name = "ubiq-proto"
version = "0.1.0"
edition = "2024"
license-file = "../../LICENSE"
description = "Ubiq: the transport contract, the bus, and the log sink"
publish = false

# Nothing here draws and nothing here touches disk. Both halves depend on this crate, so anything
# that arrives in this list becomes a dependency of the interface and the host alike.
[dependencies]
serde = { version = "1.0", features = ["derive"] }
# ULID behind the contract's id newtypes: sorts by creation time, 26 characters
ulid = { version = "3", features = ["serde"] }
flume = "0.12"
parking_lot = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Wall-clock timestamps for the log console, in the reader's own zone
chrono = { version = "0.4", features = ["serde"] }
# Query validation — already in the build graph via gpui, so this costs a line and no compile time
regex = "1"
# `blocks`'s mdast walk. Both halves already carried it — the host to index a plan, the interface to
# render one — so sharing the walk moves the dependency down rather than adding one.
markdown = "1.0"
# The bus tape serialises every message it records, and the wire form of an id is asserted against
# JSON in the tests
serde_json = "1.0"
# The socket wire format: binary, fast, and self-describing — self-describing because
# `ProjectSnapshot` uses `#[serde(flatten)]`, and because a remote host and UI may be different
# builds and need a format that does not require them to agree on field order.
rmp-serde = "1.3"
# Encodes a `Vec<u8>` as one msgpack `bin` blob instead of an array of per-byte integers — see the
# comment on the terminal byte fields in `messages.rs`.
serde_bytes = "0.11"
# `drone::verify`'s pin check: a cached drone binary's bytes against the generated manifest's
# SHA-256. Pure Rust, no C toolchain — the same reason `ubiq-host` already carries it for its TLS
# pin verifier, unconditionally here because both halves resolve a drone (`G108`).
sha2 = "0.10"

[dev-dependencies]
# `drone::verify`'s tests write a scratch binary to disk rather than asserting on a fixture path.
tempfile = "3"
# `kb`'s test that a `KbStore` defaults to `Internal` from either wire format Ubiq actually uses —
# `ubiq-host` writes the knowledge-base source list as TOML.
toml = "1"
